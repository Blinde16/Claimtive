# Firebase App Hosting configuration for Claimtive.
# Backend runs on Cloud Run; the app connects to Cloud SQL via the Cloud SQL
# Node.js connector (see lib/db.ts), keyed off INSTANCE_CONNECTION_NAME.

runConfig:
  minInstances: 0
  maxInstances: 2
  cpu: 1
  memoryMiB: 512
  concurrency: 80

env:
  # --- Cloud SQL connection (non-sensitive) ---
  - variable: INSTANCE_CONNECTION_NAME
    value: claimtive:us-central1:claimtive-db
    availability:
      - RUNTIME
  - variable: DB_USER
    value: claimtive_app
    availability:
      - RUNTIME
  - variable: DB_NAME
    value: claimtive
    availability:
      - RUNTIME

  # --- Secrets (Cloud Secret Manager) ---
  - variable: DB_PASSWORD
    secret: claimtive-db-password
    availability:
      - RUNTIME
  - variable: AUTH_SECRET
    secret: claimtive-auth-secret
    availability:
      - RUNTIME

  # --- AI layer (Claude via Vertex AI, under GCP BAA) ---
  # Auth uses ADC via the App Hosting compute SA (granted roles/aiplatform.user);
  # no API key/secret required. The orchestrator falls back to deterministic
  # rule-based insights if AI_ENABLED is false or any call/verify step fails.
  - variable: APP_URL
    value: "https://app.claimtive.com"
    availability:
      - RUNTIME
  - variable: AI_ENABLED
    value: "true"
    availability:
      - RUNTIME
  - variable: VERTEX_PROJECT_ID
    value: claimtive
    availability:
      - RUNTIME
  - variable: VERTEX_REGION
    value: us-central1
    availability:
      - RUNTIME
  # Gemini (first-party) gets generous default quota on new projects — unlike
  # Anthropic-on-Vertex which defaults to ~0. Flash is cheap and more than
  # enough for grounded summaries; the de-id + verify safety layer is model-
  # agnostic, so this is a pure config swap.
  - variable: VERTEX_MODEL
    value: gemini-2.5-flash
    availability:
      - RUNTIME
